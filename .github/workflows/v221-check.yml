name: V2.2.1 syntax check

on:
  push:
    branches: [v2.2.1-clean]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - name: Check Netlify function syntax
        run: |
          find netlify/functions -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Check V2.2.1 inline module syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('v221.html','utf8');
          const m=html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if(!m) throw new Error('module script not found');
          fs.writeFileSync('/tmp/v221-inline.mjs',m[1]);
          NODE
          node --check /tmp/v221-inline.mjs
